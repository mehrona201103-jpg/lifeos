<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — LIFEOS</title>
    <meta name="theme-color" content="#111111">
    <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/images/icon.svg">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="40" height="40">
                <rect width="64" height="64" rx="16" fill="#111"/>
                <path d="M18 44V20h8.5c6.2 0 10.2 3.2 10.2 8.4 0 5.3-4 8.5-10.2 8.5H26v7H18zm8-13.5h.3c2.4 0 3.9-1.3 3.9-3.4S28.7 24 26.3 24H26v6.5z" fill="#F7F3EB"/>
                <circle cx="46" cy="40" r="6" fill="#F7F3EB"/>
            </svg>
            <span>LIFEOS</span>
        </div>
        <h1>Создать аккаунт</h1>
        <p class="auth-subtitle">Начните организовывать свою жизнь</p>
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/register" class="auth-form" autocomplete="on">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" value="{{ username or '' }}"
                       required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+"
                       placeholder="ivan_petrov" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="display_name">Отображаемое имя</label>
                <input type="text" id="display_name" name="display_name" value="{{ display_name or '' }}"
                       required maxlength="100" placeholder="Иван Петров" autocomplete="name">
            </div>
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}"
                       required placeholder="you@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required minlength="6"
                       placeholder="Минимум 6 символов" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="password_confirm">Подтвердите пароль</label>
                <input type="password" id="password_confirm" name="password_confirm" required minlength="6"
                       autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>
        <p class="auth-footer">Уже есть аккаунт? <a href="/login">Войти</a></p>
        <p class="auth-footer" style="margin-top:0.75rem;font-size:0.75rem;opacity:0.45">
            <a href="/admin-login" style="color:inherit;text-decoration:none">Администратор</a>
        </p>
    </div>
</div>
</body>
</html>
